name: Deploy Sphinx documentation to Pages

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/*.md"
      - "docs/**"
      - "data_juicer/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/deploy_sphinx_docs.yml"
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      full:
        description: "Full rebuild of all versions (refreshes theme on old tags, cleans orphan files)"
        type: boolean
        default: false
      test_tag:
        description: "Extra release tag to also build (builds main too; mutually exclusive with full)"
        type: string
        default: ""

jobs:
  pages:
    runs-on: ubuntu-latest
    concurrency:
      # Only one publish run per group at a time, to avoid concurrent publishes
      # overwriting each other; PRs use a separate group. (GitHub has no FIFO queue; only the latest pending run is kept.)
      group: ${{ github.repository }}-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
      cancel-in-progress: false
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      PROJECT: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
      MIN_TAG: v1.4.0
      JUICER_API_URL: ${{ vars.JUICER_API_URL }}
      TEST_TAG: ${{ inputs.test_tag || '' }}
      SPHINX_CACHE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '1' || '0' }}
      SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      PREVIOUS_DIR: ${{ github.workspace }}/pages-previous
      PUBLISH_DIR: ${{ github.workspace }}/pages-publish
    steps:
      - name: Mount /mnt into workspace (writable)
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/repo
          sudo chown -R "$USER:$USER" /mnt/repo
          mkdir -p "$GITHUB_WORKSPACE/repo"
          sudo mount --bind /mnt/repo "$GITHUB_WORKSPACE/repo"
          sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE/repo"
          ls -ld /mnt/repo "$GITHUB_WORKSPACE/repo"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - name: Validate build selection
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess

          test_tag = os.environ["TEST_TAG"]
          full = os.environ["SPHINX_CACHE_FORCE"] == "1"
          if full and test_tag:
              raise SystemExit("test_tag cannot be combined with full")
          minimum = tuple(map(int, os.environ["MIN_TAG"][1:].split(".")))
          pushed_tag = (
              os.environ["GITHUB_REF"].removeprefix("refs/tags/")
              if os.environ["GITHUB_EVENT_NAME"] == "push"
              and os.environ["GITHUB_REF"].startswith("refs/tags/") else ""
          )
          for tag in filter(None, (test_tag, pushed_tag)):
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit("tag must be a release version vX.Y.Z")
              if tuple(map(int, tag[1:].split("."))) < minimum:
                  raise SystemExit("tag is below MIN_TAG")
              subprocess.run(
                  ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
                  check=True,
              )
              subprocess.run(
                  ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
                  check=True, stdout=subprocess.DEVNULL,
              )
          selected = (
              "preview" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else
              "main + all release tags >= MIN_TAG" if full else
              f"main, {test_tag}" if test_tag else pushed_tag or "main"
          )
          print(f"Selected versions: {selected}")
          PY
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}
      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get autoclean -y >/dev/null 2>&1
          sudo rm -rf /usr/local/lib/android >/dev/null 2>&1
          sudo apt clean
          df -h
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - name: Fetch Data-Juicer Sphinx Theme
        working-directory: repo
        run: |
          set -euo pipefail
          echo "Cloning sphinx theme..."
          git clone --depth=1 https://github.com/datajuicer/data-juicer-sphinx.git /tmp/template
          # Template follows the default branch HEAD. Record the actual commit so the cache fingerprint changes when the template changes.
          template_sha="$(git -C /tmp/template rev-parse HEAD)"
          [[ "$template_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "TEMPLATE_SHA=$template_sha" >> "$GITHUB_ENV"
          printf 'Template SHA: %s\n' "$template_sha"
          # CPU packages provide the real model base classes used by autodoc.
          uv pip install --system torch==2.8.0 torchvision==0.23.0 \
            --index https://download.pytorch.org/whl/cpu
          uv pip install --system -e '.[distributed,tools]' -r docs/requirements-sphinx.txt
          # Load the theme as a Sphinx extension. Its package metadata also
          # requires unused translation/NumPy dependencies that conflict with DJ.
          echo 'PYTHONPATH=/tmp/template' >> "$GITHUB_ENV"
          if [ -d "docs/sphinx_doc/source" ]; then
            echo "Backing up custom files..."
            mkdir -p /tmp/custom_files
            cp -r docs/sphinx_doc/source /tmp/custom_files
          fi
          echo "Applying template..."
          rm -rf docs/sphinx_doc
          mkdir -p docs
          cp -r /tmp/template/docs/sphinx_doc docs/
          echo "Restoring custom files..."
          cp -rf /tmp/custom_files/source/* docs/sphinx_doc/source
          printf '\nextensions.append("data_juicer_sphinx_theme")\n' >> docs/sphinx_doc/source/conf.py
          echo "Done!"
          df -h
      - name: Get git tags
        working-directory: repo
        run: |
          git fetch --all --tags
          git branch -a
          git tag
      - name: Compute compatible Sphinx cache context
        id: cache_context
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # Only emit the fingerprint; never print dependency sources or credentials. The compat context is not tied to a single ref.
          frozen = subprocess.check_output(["uv", "pip", "freeze", "--system"], text=True)
          dependencies = hashlib.sha256(
              ("\n".join(sorted(frozen.splitlines())) + "\n").encode()
          ).hexdigest()
          context = {
              "schema": "pages-cache-v2",
              "os": os.environ["RUNNER_OS"],
              "arch": os.environ["RUNNER_ARCH"],
              "image": os.environ["ImageVersion"],
              "python": sys.version,
              "python_abi": sys.implementation.cache_tag,
              "template": os.environ["TEMPLATE_SHA"],
              "dependencies": dependencies,
              "render": {key: os.environ.get(key, "") for key in (
                  "REPO_OWNER", "PROJECT", "JUICER_API_URL", "HTML_TITLE", "MIN_TAG", "PYTHONPATH"
              )},
              "api": True,
              "languages": ["en", "zh_CN"],
          }
          fingerprint = hashlib.sha256(
              json.dumps(context, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          prefix = f"pages-cache-v2-{context['os']}-{context['arch']}-{fingerprint}-"
          key = f"{prefix}{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          cache_dir = Path(os.environ["GITHUB_WORKSPACE"]).resolve() / ".cache" / "sphinx"
          cache_dir.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in {"prefix": prefix, "key": key, "path": cache_dir,
                                  "fingerprint": fingerprint}.items():
                  print(f"{name}={value}", file=output)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"SPHINX_CACHE_DIR={cache_dir}", file=output)
              print(f"SPHINX_CACHE_CONTEXT={fingerprint}", file=output)
          print(f"Template SHA: {context['template']}")
          print(f"Dependency fingerprint: {dependencies}")
          print(f"Cache compatibility fingerprint: {fingerprint}")
          PY
      - name: Restore Sphinx cache
        if: ${{ github.event_name != 'pull_request' && env.SPHINX_CACHE_FORCE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache_context.outputs.path }}
          key: ${{ steps.cache_context.outputs.key }}
          # Restore only the exact same compat context; do not fall back across templates or dependencies.
          restore-keys: ${{ steps.cache_context.outputs.prefix }}
      - id: build
        name: Build Documentation
        working-directory: repo
        run: |
          set -euo pipefail
          cd docs/sphinx_doc
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python build_versions.py --current preview
          elif [ "$SPHINX_CACHE_FORCE" = "1" ]; then
            python build_versions.py --tags
          elif [ -n "$TEST_TAG" ]; then
            python build_versions.py --branches main --tags "$TEST_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python build_versions.py --branches --tags "$GITHUB_REF_NAME"
          else
            python build_versions.py --branches main
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if ! grep -Eq '^cache_changed=(true|false)$' "$GITHUB_OUTPUT"; then
              echo '::error::template did not provide a valid cache_changed output'
              exit 1
            fi
          fi
      - name: Redirect index.html
        working-directory: repo
        run: |
          REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}"
          cd docs/sphinx_doc
          cp ./redirect.html build/index.html
          sed -i "s/\[REPOSITORY_OWNER\]/${REPOSITORY_OWNER}/g" build/index.html
          sed -i "s/\[PROJECT\]/${PROJECT}/g" build/index.html
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The preview artifact contains only preview; use a relative entry that opens offline.
            sed -i "s|https://${REPOSITORY_OWNER}.github.io/${PROJECT}/en/main/|en/preview/|g" build/index.html
          fi
          cp build/index.html build/404.html
          df -h
      - name: Read current Pages snapshot
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p "$PREVIOUS_DIR"
          if [ "$SPHINX_CACHE_FORCE" != "1" ]; then
            # Exit code 2 means the branch is absent; a network failure or snapshot read error must abort.
            set +e
            git ls-remote --exit-code --heads "$SOURCE_REPOSITORY_URL" refs/heads/gh-pages
            status=$?
            set -e
            case "$status" in
              0)
                git clone --depth=1 --single-branch --branch gh-pages \
                  "$SOURCE_REPOSITORY_URL" "$PREVIOUS_DIR"
                ;;
              2) echo 'First publication: using an empty previous-site directory' ;;
              *) echo '::error::failed to check the current gh-pages snapshot'; exit "$status" ;;
            esac
          fi
      - name: Assemble complete publication site
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: repo
        run: |
          set -euo pipefail
          cd docs/sphinx_doc
          # The template assembles from this build and the historical static HTML, validates entries, and emits the real version list.
          python build_versions.py --assemble-site "$PREVIOUS_DIR" "$PUBLISH_DIR"
      - name: Prepare preview artifact without caches
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/pages-preview"
          rsync -a --exclude='.git' --exclude='.doctrees' \
            --exclude='.buildinfo' --exclude='.sphinx-cache-state.json' \
            "$GITHUB_WORKSPACE/repo/docs/sphinx_doc/build/" "$GITHUB_WORKSPACE/pages-preview/"
      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: SphinxDoc
          path: ${{ github.event_name == 'pull_request' && format('{0}/pages-preview', github.workspace) || env.PUBLISH_DIR }}
      - name: Reject superseded source ref before publication
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: repo
        run: |
          set -euo pipefail
          # Explicitly fetch the event ref and peel annotated tags, to avoid an old result overwriting a newer commit.
          git fetch --no-tags origin "$GITHUB_REF"
          remote_commit="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          expected_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          if [ "$remote_commit" != "$expected_commit" ]; then
            echo '::error::source ref has advanced; refusing to publish a stale build'
            exit 1
          fi
      - uses: peaceiris/actions-gh-pages@v3
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          # Normal-commit publish: keep gh-pages history for rollback. keep_files: false makes
          # peaceiris git rm -r the tree first, then lay down the freshly assembled full site, so removed
          # versions/pages do not linger; doctrees are excluded during assembly, so history only accrues clean HTML.
          keep_files: false
      - name: Save changed Sphinx cache after successful publication
        if: ${{ success() && github.event_name != 'pull_request' && steps.build.outputs.cache_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache_context.outputs.path }}
          key: ${{ steps.cache_context.outputs.key }}
