project_name: agent-train-data-R0-bridge-from-analysis
# assume this dataset is processed by agent_interaction_quality_analysis.yaml (same schema as agent_interaction_quality_analysis export).
dataset_path: demos/local/pure_100s.jsonl
# dataset_path: demos/local/pure_100s_dedup_rerun.jsonl
np: 4
export_path: outputs/Rx_B_from_processed/result.jsonl
keep_stats_in_res_ds: true
use_checkpoint: true
text_keys: "id"
# load_dataset_kwargs:
#   on_mixed_types: "use_json"
#   streaming: true

process:
  # R0
  - agent_cross_model_pair_mapper:
      group_key_mode: normalized_query
      query_key: "query"
      model_meta: "agent_request_model"
      version_meta: "agent_lineage_tag_version"
      score_meta: "agent_lineage_tag_quality"
      fallback_score_stat: "llm_quality_score"
      min_group_size: 2

  - agent_session_deduplicator:
      group_key_mode: regex_extract
      timestamp_field: time
      regex_pattern: "\n- Session ID:\\s*(?P<session_id>\\S+)\\s*\n- User ID:\\s*(?P<user_id>\\S+)\\s*\n"
      regex_search_target: "messages.0.content.0.text"

